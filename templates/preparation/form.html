{% extends 'base.html' %}
{% block title %}Edit {{ transfer.product_name }}{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Edit Preparation Inventory Item</h1>

<form method="POST" style="max-width: 28rem;">
    <div class="mb-3">
        <label class="form-label">Product</label>
        <input type="text" class="form-control" value="{{ transfer.product_name }}" disabled>
    </div>
    <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" id="quantity" name="quantity" class="form-control" min="0"
               value="{{ transfer.quantity }}" required>
    </div>
    <button type="submit" class="btn btn-success">Save Changes</button>
    <a href="{{ url_for('preparation.index') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
